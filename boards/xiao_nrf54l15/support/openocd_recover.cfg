# OpenOCD config — force recover (erase all + unlock APPROTECT) for nRF54L15.
# Use when flash/debug is locked and normal openocd.cfg fails.
#
#   openocd -f openocd_recover.cfg
#
# Then power-cycle the board and use openocd.cfg normally.

source [find interface/cmsis-dap.cfg]
adapter speed 1000
transport select swd

set _CHIPNAME nrf54l

swd newdap $_CHIPNAME cpu -expected-id 0x6ba02477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# CTRL-AP: AP index may be 2 or 3 depending on silicon revision.
# We try AP 2 first; OpenOCD will report if it can't access it.
target create $_CHIPNAME.ctrl mem_ap -dap $_CHIPNAME.dap -ap-num 2

init

echo "=== Attempting APPROTECT unlock + mass erase ==="

# Write ERASEALL to CTRL-AP (offset 0x000 = ERASEALL register)
catch { $_CHIPNAME.ctrl mww 0x000 1 }
echo "  CTRL-AP ERASEALL triggered (ignore errors above if CTRL-AP not present)"

# Also try NVMC erase via the main AP if accessible
catch { $_CHIPNAME.cpu mww 0x5004b500 0x101 }
catch { $_CHIPNAME.cpu mww 0x5004b504 0x2 }
sleep 2000

echo "=== Recover done. Power-cycle the board before next use. ==="
shutdown
